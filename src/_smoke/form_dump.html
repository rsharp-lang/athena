<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style id="genui-base">
/* GenerativeUI 基础样式：为所有动态生成的界面提供统一的设计令牌与基础组件外观 */
:root {
  --gu-primary: #2E86AB;
  --gu-primary-dark: #1B5E7E;
  --gu-accent: #00B4D8;
  --gu-bg: #F4F7FA;
  --gu-surface: #FFFFFF;
  --gu-dark: #0E1B2A;
  --gu-text: #1F2937;
  --gu-muted: #6B7A8F;
  --gu-ok: #16A34A;
  --gu-err: #DC2626;
  --gu-warn: #F59E0B;
  --gu-info: #2563EB;
  --gu-border: rgba(27, 94, 126, .12);
  --gu-radius: 12px;
  --gu-radius-sm: 8px;
  --gu-shadow: 0 8px 24px rgba(15, 40, 66, .08);
  --gu-shadow-lg: 0 18px 44px rgba(15, 40, 66, .16);
  --gu-ease: cubic-bezier(.4, 0, .2, 1);
  --gu-dur: 180ms;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background: var(--gu-bg);
  color: var(--gu-text);
  font-family: "Noto Sans", "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  margin: 0 0 8px 0;
  font-weight: 700;
  letter-spacing: .2px;
}

h1 { font-size: 26px; }
h2 { font-size: 20px; }
h3 { font-size: 17px; font-weight: 600; }

p { margin: 0 0 8px 0; }

button, input, select, textarea {
  font-family: inherit;
  font-size: 14px;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  border-radius: var(--gu-radius-sm);
  padding: 9px 18px;
  font-weight: 600;
  transition: transform var(--gu-dur) var(--gu-ease), box-shadow var(--gu-dur) var(--gu-ease), background var(--gu-dur) var(--gu-ease);
}

button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(15, 40, 66, .16); }
button:active { transform: translateY(0); }
button:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }

input[type=text], input[type=number], select, textarea {
  width: 100%;
  padding: 8px 11px;
  border: 1px solid var(--gu-border);
  border-radius: var(--gu-radius-sm);
  background: var(--gu-surface);
  outline: none;
  transition: border-color var(--gu-dur) var(--gu-ease), box-shadow var(--gu-dur) var(--gu-ease);
}

input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus {
  border-color: var(--gu-primary);
  box-shadow: 0 0 0 3px rgba(46, 134, 171, .16);
}

input[type=color] {
  width: 46px;
  height: 32px;
  padding: 2px;
  border: 1px solid var(--gu-border);
  border-radius: var(--gu-radius-sm);
  background: var(--gu-surface);
  cursor: pointer;
}

input[type=range] { width: 100%; accent-color: var(--gu-primary); }

.card {
  background: var(--gu-surface);
  border: 1px solid var(--gu-border);
  border-radius: var(--gu-radius);
  box-shadow: var(--gu-shadow);
  padding: 18px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--gu-primary) 0%, var(--gu-primary-dark) 100%);
  color: #fff;
  box-shadow: 0 6px 16px rgba(27, 94, 126, .28);
}

.btn-ghost {
  background: transparent;
  color: var(--gu-primary-dark);
  border: 1px solid var(--gu-border);
}

.muted { color: var(--gu-muted); }

.genui-status {
  color: var(--gu-muted);
  font-size: 13px;
  min-height: 20px;
}

.genui-status[data-level="error"] { color: var(--gu-err); }
.genui-status[data-level="warn"] { color: var(--gu-warn); }
.genui-status[data-level="success"] { color: var(--gu-ok); }
.genui-status[data-level="info"] { color: var(--gu-primary-dark); }

@keyframes gu-fade-up {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.gu-fade-up { animation: gu-fade-up 240ms var(--gu-ease) both; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(27, 94, 126, .22); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: rgba(27, 94, 126, .38); }

</style>
<script>window.GENUI_STATE = {"params": [
  {"name":"input","label":"数据输入文件","type":"file","group":"数据输入输出","default":"","description":"留空则使用内置的 iris 数据集"},
  {"name":"out_dir","label":"结果输出目录","type":"folder","group":"数据输入输出","default":"","description":"留空则由宿主自动创建临时目录"},
  {"name":"k","label":"聚类数量","type":"integer","group":"聚类分析","default":3,"min":2,"max":10,"step":1,"options":[],"description":"kmeans 聚类算法所使用的簇数量"},
  {"name":"seed","label":"随机种子","type":"integer","group":"聚类分析","default":42,"min":1,"max":9999,"step":1,"options":[],"description":"随机种子，保证聚类结果可复现"},
  {"name":"scale_data","label":"标准化数据","type":"bool","group":"聚类分析","default":true,"description":"是否在 PCA 与聚类之前对数据做标准化"},
  {"name":"palette","label":"配色方案","type":"select","group":"可视化样式","default":"rainbow","options":["rainbow","heat.colors","terrain.colors","topo.colors","cm.colors","hcl.dark3"],"description":"绘图所使用的 R 调色板"},
  {"name":"point_color","label":"主色","type":"color","group":"可视化样式","default":"#2E86AB","description":"回归线等单色元素的颜色"},
  {"name":"point_size","label":"点大小","type":"number","group":"可视化样式","default":1.35,"min":0.4,"max":3,"step":0.05,"options":[],"description":"散点的大小"},
  {"name":"species_filter","label":"物种筛选","type":"text","group":"数据筛选","default":"","description":"逗号分隔的物种名，留空表示不筛选"},
  {"name":"title","label":"图表标题","type":"text","group":"可视化样式","default":"Iris 数据集综合分析","description":"所有结果图的主标题"}
]
};</script>
<script id="genui-boot">
/* GenerativeUI 引导脚本：注入到每一个动态生成的页面之中，
   为页面内的 JavaScript 代码提供调用宿主能力的统一门面 window.GenUI */
(function () {
    'use strict';

    if (window.GenUI) { return; }

    var state = window.GENUI_STATE || {};

    function qs(sel, root) { return (root || document).querySelector(sel); }
    function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

    function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) { n.className = cls; }
        if (text !== undefined && text !== null) { n.textContent = text; }
        return n;
    }

    /* 取得注入进来的宿主对象：优先使用 window.host，
       其次回退到 chrome.webview.hostObjects.host 异步代理 */
    function hostObject() {
        if (window.host) return window.host;
        if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects) {
            return window.chrome.webview.hostObjects.host;
        }
        throw new Error('宿主对象 window.host 不可用：当前页面并没有运行在 WebView2 环境之中');
    }

    var GenUI = {
        version: '1.0',
        state: state,
        params: state.params || [],
        host: null,

        /* 调用宿主命令；payload 为普通对象，返回值是宿主回传的 data 字段 */
        call: function (cmd, payload) {
            var json = '{}';
            try { json = JSON.stringify(payload === undefined ? {} : (payload || {})); }
            catch (e) { json = '{}'; }

            return Promise.resolve(hostObject().invoke(cmd, json)).then(function (text) {
                var r;
                try { r = JSON.parse(text); }
                catch (e) { throw new Error('宿主返回的不是合法的 JSON: ' + String(text).slice(0, 200)); }
                if (!r || !r.ok) { throw new Error((r && r.error) || '宿主命令执行失败'); }
                return r.data;
            });
        },

        /* 更新页面上的状态文本 */
        status: function (msg, level) {
            var nodes = qsa('[data-genui-status], #genui-status, .genui-status');
            nodes.forEach(function (n) {
                n.textContent = msg || '';
                if (level) { n.setAttribute('data-level', level); }
            });
            if (!nodes.length) { console.log('[genui]', msg); }
            return msg;
        },

        /* 收集页面上所有带 data-gu-param 属性的控件的值 */
        collect: function () {
            var values = {};
            var missing = [];

            qsa('[data-gu-param]').forEach(function (n) {
                var name = n.getAttribute('data-gu-param');
                if (!name) { return; }

                var v;
                if (n.type === 'checkbox') {
                    v = !!n.checked;
                } else if (n.type === 'number' || n.type === 'range') {
                    v = n.value === '' ? null : Number(n.value);
                } else {
                    v = String(n.value === null ? '' : n.value).trim();
                }

                if ((v === '' || v === null) && n.hasAttribute('data-gu-required')) {
                    missing.push(n.getAttribute('data-gu-label') || name);
                }

                values[name] = v;
            });

            if (missing.length) {
                throw new Error('以下必填参数还没有填写: ' + missing.join('、'));
            }

            return values;
        },

        /* 一键执行：收集参数并调用 run_script */
        run: function (extra) {
            var params = GenUI.collect();
            if (extra) { Object.keys(extra).forEach(function (k) { params[k] = extra[k]; }); }
            return GenUI.call('run_script', params);
        },

        /* 打开一个文件/目录选择对话框，返回宿主选择的路径 */
        browse: function (kind, filter) {
            return GenUI.call(kind === 'folder' ? 'browse_folder' : 'browse_file', { filter: filter || '' });
        },

        /* 渲染一张图片结果 */
        image: function (img) {
            var box = el('figure', 'gu-figure');
            var figure = el('div', 'gu-figure-frame');
            var image = el('img');
            image.src = img.dataUri || img.uri;
            image.alt = img.title || img.name || '';
            image.loading = 'lazy';
            image.onerror = function () { image.alt = '图片加载失败: ' + (img.name || ''); };
            figure.appendChild(image);
            box.appendChild(figure);
            box.appendChild(el('figcaption', 'gu-figure-caption', img.title || img.name || ''));
            return box;
        },

        /* 渲染一张表格结果 */
        table: function (t) {
            var wrap = el('div', 'gu-table-wrap');
            var table = el('table', 'gu-table');
            var thead = el('thead');
            var hr = el('tr');

            (t.headers || []).forEach(function (h) { hr.appendChild(el('th', null, h)); });
            thead.appendChild(hr);
            table.appendChild(thead);

            var tbody = el('tbody');
            (t.rows || []).forEach(function (row) {
                var tr = el('tr');
                row.forEach(function (c) { tr.appendChild(el('td', null, c === null || c === undefined ? '' : String(c))); });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);

            wrap.appendChild(el('div', 'gu-table-title', t.title || t.name || ''));
            wrap.appendChild(table);
            return wrap;
        },

        /* 渲染一段文本结果 */
        text: function (t) {
            var box = el('div', 'gu-text-result gu-fade-up');
            box.appendChild(el('div', 'gu-text-title', t.title || t.name || ''));
            var pre = el('pre', 'gu-pre', t.text || '');
            box.appendChild(pre);
            return box;
        },

        /* 把宿主回传的 AnalysisResult 渲染到指定容器之中 */
        renderResult: function (containerId, data) {
            var box = typeof containerId === 'string' ? qs('#' + containerId) : containerId;
            if (!box) { return; }

            box.innerHTML = '';

            var images = data.images || [];
            var tables = data.tables || [];
            var texts = data.texts || [];

            if (images.length) {
                var grid = el('div', 'gu-figure-grid');
                images.forEach(function (img) { grid.appendChild(GenUI.image(img)); });
                box.appendChild(grid);
            }

            tables.forEach(function (t) { box.appendChild(GenUI.table(t)); });
            texts.forEach(function (t) { box.appendChild(GenUI.text(t)); });

            if (!images.length && !tables.length && !texts.length) {
                box.appendChild(el('div', 'muted', '本次运行没有产生任何结果文件。'));
            }

            box.classList.add('gu-fade-up');
        },

        /* 打开一个文件对话框选择 R 脚本，并触发后续的分析与界面生成流程 */
        openScript: function () {
            return GenUI.call('open_rscript', {});
        },

        /* 载入内置的示例脚本 */
        loadDemo: function () {
            return GenUI.call('load_demo', {});
        },

        el: el,
        qs: qs,
        qsa: qsa
    };

    GenUI.host = hostObject;
    window.GenUI = GenUI;

    /* 宿主可以直接调用这个全局函数把运行状态推送到页面上 */
    window.genui_status = function (msg, level) { return GenUI.status(msg, level); };

    /* 页面通用的结果区基础样式 */
    var extra = document.createElement('style');
    extra.textContent = [
        '.gu-figure-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;}',
        '.gu-figure{margin:0;background:#fff;border:1px solid var(--gu-border);border-radius:var(--gu-radius);overflow:hidden;box-shadow:var(--gu-shadow);transition:transform var(--gu-dur) var(--gu-ease),box-shadow var(--gu-dur) var(--gu-ease);}',
        '.gu-figure:hover{transform:translateY(-3px);box-shadow:var(--gu-shadow-lg);}',
        '.gu-figure-frame{background:linear-gradient(135deg,#0E1B2A,#123049);padding:8px;}',
        '.gu-figure img{display:block;width:100%;height:auto;cursor:zoom-in;}',
        '.gu-figure-caption{padding:10px 12px;font-size:13px;color:var(--gu-muted);border-top:1px solid var(--gu-border);}',
        '.gu-table-wrap{margin:16px 0;background:#fff;border:1px solid var(--gu-border);border-radius:var(--gu-radius);overflow:auto;max-height:420px;box-shadow:var(--gu-shadow);}',
        '.gu-table-title{padding:10px 14px;font-weight:600;border-bottom:1px solid var(--gu-border);position:sticky;top:0;background:#fff;z-index:2;}',
        '.gu-table{border-collapse:collapse;width:100%;font-size:13px;}',
        '.gu-table th,.gu-table td{padding:7px 12px;text-align:left;white-space:nowrap;}',
        '.gu-table thead th{background:#F4F7FA;color:var(--gu-primary-dark);position:sticky;top:41px;z-index:1;}',
        '.gu-table tbody tr:nth-child(even){background:#FAFCFD;}',
        '.gu-table tbody tr:hover{background:rgba(0,180,216,.08);}',
        '.gu-text-result{margin:16px 0;background:#fff;border:1px solid var(--gu-border);border-radius:var(--gu-radius);box-shadow:var(--gu-shadow);overflow:hidden;}',
        '.gu-text-title{padding:10px 14px;font-weight:600;border-bottom:1px solid var(--gu-border);}',
        '.gu-pre{margin:0;padding:12px 14px;font-family:Consolas,"Courier New",monospace;font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto;color:#334155;}'
    ].join('');
    document.head.appendChild(extra);

    /* 接收宿主推送过来的状态消息 */
    if (window.chrome && window.chrome.webview) {
        window.chrome.webview.addEventListener('message', function (e) {
            var d = e.data;
            if (d && d.action === 'status') { GenUI.status(d.message, d.level); }
        });
    }
})();

</script><style>.gu-figure-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;}.gu-figure{margin:0;background:#fff;border:1px solid var(--gu-border);border-radius:var(--gu-radius);overflow:hidden;box-shadow:var(--gu-shadow);transition:transform var(--gu-dur) var(--gu-ease),box-shadow var(--gu-dur) var(--gu-ease);}.gu-figure:hover{transform:translateY(-3px);box-shadow:var(--gu-shadow-lg);}.gu-figure-frame{background:linear-gradient(135deg,#0E1B2A,#123049);padding:8px;}.gu-figure img{display:block;width:100%;height:auto;cursor:zoom-in;}.gu-figure-caption{padding:10px 12px;font-size:13px;color:var(--gu-muted);border-top:1px solid var(--gu-border);}.gu-table-wrap{margin:16px 0;background:#fff;border:1px solid var(--gu-border);border-radius:var(--gu-radius);overflow:auto;max-height:420px;box-shadow:var(--gu-shadow);}.gu-table-title{padding:10px 14px;font-weight:600;border-bottom:1px solid var(--gu-border);position:sticky;top:0;background:#fff;z-index:2;}.gu-table{border-collapse:collapse;width:100%;font-size:13px;}.gu-table th,.gu-table td{padding:7px 12px;text-align:left;white-space:nowrap;}.gu-table thead th{background:#F4F7FA;color:var(--gu-primary-dark);position:sticky;top:41px;z-index:1;}.gu-table tbody tr:nth-child(even){background:#FAFCFD;}.gu-table tbody tr:hover{background:rgba(0,180,216,.08);}.gu-text-result{margin:16px 0;background:#fff;border:1px solid var(--gu-border);border-radius:var(--gu-radius);box-shadow:var(--gu-shadow);overflow:hidden;}.gu-text-title{padding:10px 14px;font-weight:600;border-bottom:1px solid var(--gu-border);}.gu-pre{margin:0;padding:12px 14px;font-family:Consolas,"Courier New",monospace;font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto;color:#334155;}</style>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>参数调整与执行</title>
<style>
  body {
    background:
      radial-gradient(1000px 520px at 8% -12%, rgba(0, 180, 216, .16), transparent 58%),
      radial-gradient(820px 480px at 104% 0%, rgba(46, 134, 171, .18), transparent 60%),
      var(--gu-bg);
    min-height: 100vh;
    padding-bottom: 96px;
  }
  .topbar {
    background: linear-gradient(120deg, #0E1B2A 0%, #1B5E7E 58%, #2E86AB 100%);
    color: #fff;
    padding: 18px 28px;
    box-shadow: 0 10px 30px rgba(14, 27, 42, .28);
  }
  .topbar .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .topbar h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .4px; }
  .topbar .sub { color: rgba(255, 255, 255, .72); font-size: 13px; margin: 4px 0 0 0; }
  .chip {
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .14);
    border: 1px solid rgba(255, 255, 255, .2);
    font-size: 12px;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #22C55E; box-shadow: 0 0 0 4px rgba(34, 197, 94, .22);
    display: inline-block; margin-right: 7px;
  }
  main { max-width: 1280px; margin: 0 auto; padding: 22px 24px 0 24px; }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .group-card {
    background: var(--gu-surface);
    border: 1px solid var(--gu-border);
    border-radius: var(--gu-radius);
    box-shadow: var(--gu-shadow);
    padding: 16px 18px 18px 18px;
  }
  .group-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 700; color: var(--gu-primary-dark);
    padding-bottom: 10px; margin-bottom: 12px;
    border-bottom: 1px dashed var(--gu-border);
  }
  .group-title::before {
    content: ""; width: 4px; height: 15px; border-radius: 3px;
    background: linear-gradient(180deg, var(--gu-accent), var(--gu-primary));
  }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--gu-text); margin-bottom: 5px; }
  .field .hint { font-size: 11.5px; color: var(--gu-muted); margin-top: 4px; }
  .inline { display: flex; gap: 8px; align-items: center; }
  .inline input[type=text] { flex: 1; }
  .inline button {
    padding: 8px 12px; font-size: 12.5px; border-radius: var(--gu-radius-sm);
    background: #EEF5F9; color: var(--gu-primary-dark); border: 1px solid var(--gu-border);
  }
  .switch { display: flex; align-items: center; gap: 9px; }
  .switch input { width: 17px; height: 17px; accent-color: var(--gu-primary); }
  .result-card {
    background: var(--gu-surface);
    border: 1px solid var(--gu-border);
    border-radius: var(--gu-radius);
    box-shadow: var(--gu-shadow);
    overflow: hidden;
    margin-bottom: 24px;
  }
  .tabs { display: flex; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--gu-border); background: #FAFCFE; flex-wrap: wrap; }
  .tabs button { background: transparent; color: var(--gu-muted); padding: 7px 14px; font-size: 13px; border-radius: 8px; }
  .tabs button:hover { transform: none; box-shadow: none; background: rgba(46, 134, 171, .09); }
  .tabs button.on { background: linear-gradient(135deg, var(--gu-primary), var(--gu-primary-dark)); color: #fff; }
  .panel { padding: 18px; display: none; }
  .panel.on { display: block; }
  .empty { color: var(--gu-muted); text-align: center; padding: 40px 0; font-size: 13.5px; }
  .metrics { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 14px; }
  .metric { padding: 8px 14px; border-radius: 10px; background: #F4F7FA; border: 1px solid var(--gu-border); font-size: 12.5px; }
  .metric b { color: var(--gu-primary-dark); font-size: 15px; margin-left: 6px; }
  .log-ok { color: var(--gu-ok); }
  .log-err { color: var(--gu-err); }
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 28px;
    background: rgba(255, 255, 255, .9);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--gu-border);
    box-shadow: 0 -8px 24px rgba(15, 40, 66, .08);
  }
  .actionbar .spacer { flex: 1; }
  .btn-run {
    background: linear-gradient(135deg, var(--gu-primary), var(--gu-primary-dark));
    color: #fff; padding: 11px 30px; font-size: 14.5px;
    box-shadow: 0 8px 20px rgba(27, 94, 126, .3);
  }
  .btn-run[disabled] { opacity: .6; }
  .lightbox {
    position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center;
    background: rgba(6, 14, 24, .86); padding: 28px;
  }
  .lightbox.on { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }
  .spinner {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .4); border-top-color: #fff;
    display: inline-block; vertical-align: -2px; margin-right: 8px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header class="topbar">
  <div class="row">
    <h1 id="page-title">分析工作台</h1>
    <span class="chip" id="chip-model">—</span>
    <span class="chip"><span class="dot" id="status-dot"></span><span id="status-text">就绪</span></span>
  </div>
  <p class="sub" id="page-sub">调整下面的参数，然后点击右下角的「执行分析」按钮</p>
</header>

<main>
  <section id="form-area" class="form-grid"><div class="group-card"><div class="group-title">数据输入输出</div><div class="field"><label>数据输入文件</label><div class="inline"><input type="text" data-gu-param="input" data-gu-label="数据输入文件"><button type="button">浏览</button></div><div class="hint">留空则使用内置的 iris 数据集</div></div><div class="field"><label>结果输出目录</label><div class="inline"><input type="text" data-gu-param="out_dir" data-gu-label="结果输出目录"><button type="button">浏览</button></div><div class="hint">留空则由宿主自动创建临时目录</div></div></div><div class="group-card"><div class="group-title">聚类分析</div><div class="field"><label>聚类数量</label><input type="number" min="2" max="10" step="1" data-gu-param="k" data-gu-label="聚类数量"><div class="hint">kmeans 聚类算法所使用的簇数量</div></div><div class="field"><label>随机种子</label><input type="number" min="1" max="9999" step="1" data-gu-param="seed" data-gu-label="随机种子"><div class="hint">随机种子，保证聚类结果可复现</div></div><div class="field"><label>标准化数据</label><div class="switch"><input type="checkbox" data-gu-param="scale_data" data-gu-label="标准化数据"><span style="font-size: 13px;">启用</span></div><div class="hint">是否在 PCA 与聚类之前对数据做标准化</div></div></div><div class="group-card"><div class="group-title">可视化样式</div><div class="field"><label>配色方案</label><select data-gu-param="palette" data-gu-label="配色方案"><option value="rainbow">rainbow</option><option value="heat.colors">heat.colors</option><option value="terrain.colors">terrain.colors</option><option value="topo.colors">topo.colors</option><option value="cm.colors">cm.colors</option><option value="hcl.dark3">hcl.dark3</option></select><div class="hint">绘图所使用的 R 调色板</div></div><div class="field"><label>主色</label><div class="inline"><input type="color" data-gu-param="point_color" data-gu-label="主色"><input type="text" style="max-width: 120px;"></div><div class="hint">回归线等单色元素的颜色</div></div><div class="field"><label>点大小</label><input type="number" min="0.4" max="3" step="0.05" data-gu-param="point_size" data-gu-label="点大小"><div class="hint">散点的大小</div></div><div class="field"><label>图表标题</label><input type="text" data-gu-param="title" data-gu-label="图表标题"><div class="hint">所有结果图的主标题</div></div></div><div class="group-card"><div class="group-title">数据筛选</div><div class="field"><label>物种筛选</label><input type="text" data-gu-param="species_filter" data-gu-label="物种筛选"><div class="hint">逗号分隔的物种名，留空表示不筛选</div></div></div></section>

  <section class="result-card">
    <div class="tabs">
      <button class="on" data-tab="p-images" onclick="switchTab('p-images')">结果图片</button>
      <button data-tab="p-tables" onclick="switchTab('p-tables')">结果表格</button>
      <button data-tab="p-texts" onclick="switchTab('p-texts')">结果文本</button>
      <button data-tab="p-log" onclick="switchTab('p-log')">运行日志</button>
    </div>
    <div class="panel on" id="p-images"><div class="empty" id="images-empty">还没有运行过分析，点击「执行分析」以生成结果图片。</div><div id="result-area"></div></div>
    <div class="panel" id="p-tables"><div class="empty">还没有运行过分析。</div><div id="tables-area"></div></div>
    <div class="panel" id="p-texts"><div class="empty">还没有运行过分析。</div><div id="texts-area"></div></div>
    <div class="panel" id="p-log"><div class="empty" id="log-empty">还没有运行过分析。</div><div id="log-area"></div></div>
  </section>
</main>

<div class="actionbar">
  <span class="genui-status" data-genui-status="1">就绪</span>
  <span class="spacer"></span>
  <button class="btn-ghost" onclick="resetParams()">重置为默认值</button>
  <button class="btn-run" id="btn-run" onclick="doRun()">执行分析</button>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('on')"><img id="lightbox-img" alt=""></div>

<script>
  var defaults = {};

  function switchTab(id) {
    document.querySelectorAll('.panel').forEach(function (p) { p.classList.toggle('on', p.id === id); });
    document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === id); });
  }

  function setStatus(text, level) {
    GenUI.status(text, level);
    var dot = document.getElementById('status-dot');
    var st = document.getElementById('status-text');
    if (st) st.textContent = text || '就绪';
    if (dot) dot.style.background = level === 'error' ? '#DC2626' : (level === 'warn' ? '#F59E0B' : (level === 'success' ? '#22C55E' : '#00B4D8'));
  }

  function makeField(p) {
    var wrap = document.createElement('div');
    wrap.className = 'field';

    var label = document.createElement('label');
    label.textContent = p.label || p.name;
    wrap.appendChild(label);

    var ctl;

    if (p.type === 'bool') {
      var sw = document.createElement('div');
      sw.className = 'switch';
      ctl = document.createElement('input');
      ctl.type = 'checkbox';
      sw.appendChild(ctl);
      var sp = document.createElement('span');
      sp.textContent = '启用';
      sp.style.fontSize = '13px';
      sw.appendChild(sp);
      wrap.appendChild(sw);
      defaults[p.name] = String(p['default']).toLowerCase() === 'true' || p['default'] === '1';
      ctl.checked = defaults[p.name];
      ctl.setAttribute('data-gu-param', p.name);
      ctl.setAttribute('data-gu-label', p.label || p.name);
      appendHint(wrap, p);
      return wrap;
    }

    if (p.type === 'select') {
      ctl = document.createElement('select');
      (p.options || []).forEach(function (o) {
        var op = document.createElement('option');
        op.value = o; op.textContent = o;
        ctl.appendChild(op);
      });
    } else if (p.type === 'textarea') {
      ctl = document.createElement('textarea');
      ctl.rows = 3;
    } else if (p.type === 'color') {
      ctl = document.createElement('input');
      ctl.type = 'color';
    } else if (p.type === 'number' || p.type === 'integer') {
      ctl = document.createElement('input');
      ctl.type = 'number';
      if (p.min !== null && p.min !== undefined) ctl.min = p.min;
      if (p.max !== null && p.max !== undefined) ctl.max = p.max;
      if (p.step !== null && p.step !== undefined) ctl.step = p.step;
    } else {
      ctl = document.createElement('input');
      ctl.type = 'text';
    }

    defaults[p.name] = (p['default'] === null || p['default'] === undefined) ? '' : String(p['default']);

    if (ctl.type === 'color') {
      var box = document.createElement('div');
      box.className = 'inline';
      ctl.value = defaults[p.name] || '#2E86AB';
      ctl.setAttribute('data-gu-param', p.name);
      ctl.setAttribute('data-gu-label', p.label || p.name);
      var hex = document.createElement('input');
      hex.type = 'text';
      hex.value = ctl.value;
      hex.style.maxWidth = '120px';
      ctl.addEventListener('input', function () { hex.value = ctl.value; });
      hex.addEventListener('change', function () {
        if (/^#[0-9a-fA-F]{6}$/.test(hex.value)) ctl.value = hex.value;
      });
      box.appendChild(ctl);
      box.appendChild(hex);
      wrap.appendChild(box);
      appendHint(wrap, p);
      return wrap;
    }

    ctl.value = defaults[p.name];
    ctl.setAttribute('data-gu-param', p.name);
    ctl.setAttribute('data-gu-label', p.label || p.name);

    if (p.type === 'file' || p.type === 'folder') {
      var row = document.createElement('div');
      row.className = 'inline';
      row.appendChild(ctl);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = '浏览';
      btn.addEventListener('click', function () {
        var kind = p.type === 'folder' ? 'folder' : 'file';
        var filter = p.type === 'folder' ? '' : '数据文件|*.csv;*.txt;*.tsv;*.R|所有文件|*.*';
        setStatus('正在打开文件对话框…', 'info');
        GenUI.browse(kind, filter).then(function (path) {
          if (path) { ctl.value = path; setStatus('已选择: ' + path, 'success'); }
          else { setStatus('已取消选择', 'warn'); }
        }).catch(function (err) { setStatus(err.message || String(err), 'error'); });
      });
      row.appendChild(btn);
      wrap.appendChild(row);
    } else {
      wrap.appendChild(ctl);
    }

    appendHint(wrap, p);
    return wrap;
  }

  function appendHint(wrap, p) {
    if (p.description) {
      var hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = p.description;
      wrap.appendChild(hint);
    }
  }

  function buildForm(params) {
    var area = document.getElementById('form-area');
    area.innerHTML = '';
    var groups = {};
    var order = [];

    (params || []).forEach(function (p) {
      var g = p.group || '运行参数';
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push(p);
    });

    order.forEach(function (g) {
      var card = document.createElement('div');
      card.className = 'group-card';
      var title = document.createElement('div');
      title.className = 'group-title';
      title.textContent = g;
      card.appendChild(title);
      groups[g].forEach(function (p) { card.appendChild(makeField(p)); });
      area.appendChild(card);
    });

    if (!order.length) {
      area.innerHTML = '<div class="group-card"><div class="empty">没有检测到任何可调参数，可以直接执行分析。</div></div>';
    }
  }

  function resetParams() {
    document.querySelectorAll('[data-gu-param]').forEach(function (n) {
      var name = n.getAttribute('data-gu-param');
      if (n.type === 'checkbox') n.checked = !!defaults[name];
      else n.value = defaults[name];
    });
    setStatus('参数已经重置为默认值', 'info');
  }

  function showLightbox(src) {
    var box = document.getElementById('lightbox');
    document.getElementById('lightbox-img').src = src;
    box.classList.add('on');
  }

  function renderResult(data) {
    document.getElementById('images-empty').style.display = (data.images && data.images.length) ? 'none' : '';
    GenUI.renderResult('result-area', data);

    document.querySelectorAll('#result-area img').forEach(function (img) {
      img.addEventListener('click', function () { showLightbox(img.src); });
    });

    var tablesArea = document.getElementById('tables-area');
    tablesArea.innerHTML = '';
    (data.tables || []).forEach(function (t) { tablesArea.appendChild(GenUI.table(t)); });

    var textsArea = document.getElementById('texts-area');
    textsArea.innerHTML = '';
    (data.texts || []).forEach(function (t) { textsArea.appendChild(GenUI.text(t)); });

    var logArea = document.getElementById('log-area');
    document.getElementById('log-empty').style.display = 'none';
    logArea.innerHTML = '';

    var metrics = document.createElement('div');
    metrics.className = 'metrics';
    [['退出码', data.exitCode], ['耗时', (data.elapsed_ms || 0) + ' ms'],
     ['图片', (data.images || []).length], ['表格', (data.tables || []).length]].forEach(function (kv) {
      var m = document.createElement('div');
      m.className = 'metric';
      m.innerHTML = kv[0] + '<b>' + kv[1] + '</b>';
      metrics.appendChild(m);
    });
    logArea.appendChild(metrics);

    if (data.command) {
      var cmd = document.createElement('div');
      cmd.className = 'gu-text-result';
      cmd.innerHTML = '<div class="gu-text-title">命令行</div><pre class="gu-pre">' + escapeHtml(data.command) + '</pre>';
      logArea.appendChild(cmd);
    }
    if (data.stdout) {
      logArea.appendChild(GenUI.text({ title: '标准输出 (stdout)', text: data.stdout }));
    }
    if (data.stderr) {
      var errBox = GenUI.text({ title: '标准错误 (stderr)', text: data.stderr });
      var pre = errBox.querySelector('.gu-pre');
      if (pre) pre.className = 'gu-pre log-err';
      logArea.appendChild(errBox);
    }
    if (data.error) {
      var box = document.createElement('div');
      box.className = 'gu-text-result';
      box.innerHTML = '<div class="gu-text-title" style="color:#DC2626">错误信息</div><pre class="gu-pre log-err">' + escapeHtml(data.error) + '</pre>';
      logArea.appendChild(box);
    }
  }

  function escapeHtml(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  async function doRun() {
    var btn = document.getElementById('btn-run');
    btn.disabled = true;
    var old = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span>正在分析…';
    setStatus('正在调用 GNU R 执行脚本，请稍候…', 'info');

    try {
      var data = await GenUI.run();
      renderResult(data);
      if (data.success) setStatus('分析完成，共生成 ' + (data.images || []).length + ' 张图、' + (data.tables || []).length + ' 张表', 'success');
      else setStatus('脚本运行结束但退出码非 0：' + (data.error || '请查看运行日志'), 'error');
      switchTab('p-images');
    } catch (err) {
      setStatus(err.message || String(err), 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = old;
    }
  }

  (function init() {
    buildForm(GenUI.params || []);
    GenUI.call('get_context', {}).then(function (ctx) {
      if (ctx && ctx.model) document.getElementById('chip-model').textContent = ctx.model;
      if (ctx && ctx.script) {
        document.getElementById('page-sub').textContent = '当前脚本: ' + ctx.script;
      }
    }).catch(function () { });
  })();
</script>

</body></html>
