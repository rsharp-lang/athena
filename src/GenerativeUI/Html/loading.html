<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{title}}</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(900px 520px at 12% -10%, rgba(0, 180, 216, .30), transparent 60%),
      radial-gradient(760px 460px at 105% 110%, rgba(46, 134, 171, .34), transparent 62%),
      linear-gradient(160deg, #0E1B2A 0%, #123049 55%, #0B1522 100%);
    color: #EAF4FA;
    font-family: "Noto Sans", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .panel {
    width: min(620px, 92vw);
    padding: 34px 34px 26px 34px;
    border-radius: 20px;
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .14);
    box-shadow: 0 24px 60px rgba(3, 12, 22, .48);
    backdrop-filter: blur(18px);
    text-align: center;
  }
  .orb {
    position: relative;
    width: 74px;
    height: 74px;
    margin: 0 auto 20px auto;
    border-radius: 50%;
    background: linear-gradient(135deg, #00B4D8, #2E86AB 60%, #1B5E7E);
    box-shadow: 0 0 0 0 rgba(0, 180, 216, .55);
    animation: pulse 1.9s cubic-bezier(.4, 0, .2, 1) infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    font-weight: 700;
    color: #fff;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(0, 180, 216, .55), 0 0 34px rgba(0, 180, 216, .48); transform: scale(.96); }
    70% { box-shadow: 0 0 0 22px rgba(0, 180, 216, 0), 0 0 34px rgba(0, 180, 216, .48); transform: scale(1.03); }
    100% { box-shadow: 0 0 0 0 rgba(0, 180, 216, 0), 0 0 34px rgba(0, 180, 216, .48); transform: scale(.96); }
  }
  h1 { font-size: 26px; font-weight: 700; margin: 0 0 8px 0; letter-spacing: .4px; }
  .sub { color: rgba(234, 244, 250, .72); font-size: 14px; margin: 0 0 22px 0; min-height: 20px; }
  .bar {
    position: relative;
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .13);
    overflow: hidden;
  }
  .bar i {
    position: absolute;
    inset: 0;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, #00B4D8, #7FE3F5, transparent);
    animation: slide 1.35s cubic-bezier(.4, 0, .2, 1) infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(320%); }
  }
  .status {
    margin: 18px 0 0 0;
    min-height: 22px;
    font-size: 13.5px;
    color: #8FE1F5;
    letter-spacing: .2px;
  }
  .steps {
    list-style: none;
    margin: 22px 0 0 0;
    padding: 0;
    display: grid;
    gap: 9px;
    text-align: left;
  }
  .steps li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 13px;
    border-radius: 10px;
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .09);
    font-size: 13px;
    color: rgba(234, 244, 250, .82);
  }
  .steps li b {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    min-width: 20px;
    border-radius: 50%;
    background: rgba(0, 180, 216, .22);
    color: #7FE3F5;
    font-size: 11.5px;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="orb">AI</div>
    <h1>{{title}}</h1>
    <p class="sub">{{message}}</p>
    <div class="bar"><i></i></div>
    <p class="status genui-status" data-genui-status="1">正在初始化…</p>
    <ul class="steps">{{steps}}</ul>
  </div>
</body>
</html>
