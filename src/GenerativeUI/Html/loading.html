<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{title}}</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(1100px 620px at 8% -14%, rgba(0, 180, 216, .30), transparent 58%),
      radial-gradient(900px 540px at 106% 4%, rgba(46, 134, 171, .34), transparent 60%),
      linear-gradient(160deg, #0E1B2A 0%, #123049 52%, #0B1522 100%);
    color: #EAF4FA;
    font-family: "Noto Sans", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }

  /* ---------------- 顶部：标题 + 进度 + 步骤 ---------------- */
  header {
    flex: 0 0 auto;
    padding: 18px 30px 14px 30px;
    background: rgba(255, 255, 255, .045);
    border-bottom: 1px solid rgba(255, 255, 255, .1);
    backdrop-filter: blur(14px);
  }
  .head-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .orb {
    width: 42px; height: 42px; border-radius: 12px; flex: 0 0 auto;
    background: linear-gradient(135deg, #00B4D8, #2E86AB 62%, #1B5E7E);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: #fff;
    box-shadow: 0 0 0 0 rgba(0, 180, 216, .5);
    animation: pulse 1.9s cubic-bezier(.4, 0, .2, 1) infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(0, 180, 216, .5), 0 0 26px rgba(0, 180, 216, .42); transform: scale(.96); }
    70%  { box-shadow: 0 0 0 16px rgba(0, 180, 216, 0), 0 0 26px rgba(0, 180, 216, .42); transform: scale(1.03); }
    100% { box-shadow: 0 0 0 0 rgba(0, 180, 216, 0), 0 0 26px rgba(0, 180, 216, .42); transform: scale(.96); }
  }
  h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: .4px; }
  .sub { color: rgba(234, 244, 250, .7); font-size: 13px; margin: 3px 0 0 0; }
  .status {
    margin-left: auto; text-align: right; max-width: 46%;
    font-size: 12.5px; color: #8FE1F5; min-height: 20px; line-height: 1.5;
  }

  .bar {
    position: relative; height: 5px; border-radius: 999px; margin-top: 14px;
    background: rgba(255, 255, 255, .12); overflow: hidden;
  }
  .bar i {
    position: absolute; inset: 0; width: 32%; border-radius: 999px;
    background: linear-gradient(90deg, transparent, #00B4D8, #7FE3F5, transparent);
    animation: slide 1.5s cubic-bezier(.4, 0, .2, 1) infinite;
  }
  @keyframes slide { 0% { transform: translateX(-115%); } 100% { transform: translateX(340%); } }

  .steps { list-style: none; margin: 13px 0 0 0; padding: 0; display: flex; gap: 10px; flex-wrap: wrap; }
  .steps li {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(255, 255, 255, .055);
    border: 1px solid rgba(255, 255, 255, .09);
    color: rgba(234, 244, 250, .72);
  }
  .steps li b {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%; font-size: 10.5px;
    background: rgba(0, 180, 216, .22); color: #7FE3F5;
  }

  /* ---------------- 主体：AI 实时输出 ---------------- */
  main { flex: 1 1 auto; min-height: 0; padding: 14px 30px 22px 30px; display: flex; }
  .stream {
    flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    border-radius: 16px; overflow: hidden;
    background: rgba(3, 12, 22, .42);
    border: 1px solid rgba(255, 255, 255, .1);
    box-shadow: 0 18px 44px rgba(3, 12, 22, .42);
  }
  .stream-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: rgba(255, 255, 255, .05);
    border-bottom: 1px solid rgba(255, 255, 255, .09);
  }
  .stream-title { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
  .live {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: #7FE3F5;
  }
  .live i {
    width: 7px; height: 7px; border-radius: 50%; background: #22C55E;
    box-shadow: 0 0 0 3px rgba(34, 197, 94, .2);
    animation: blink 1.1s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .phase {
    padding: 3px 11px; border-radius: 999px; font-size: 11.5px;
    background: rgba(0, 180, 216, .16);
    border: 1px solid rgba(127, 227, 245, .3);
    color: #A5E8F7;
  }
  .stat { margin-left: auto; font-size: 11.5px; color: rgba(234, 244, 250, .55); }

  .stream-body {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
  }
  @media (max-width: 900px) { .stream-body { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }

  .col { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .col + .col { border-left: 1px solid rgba(255, 255, 255, .09); }
  .col-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 7px;
    padding: 8px 16px; font-size: 11.5px; font-weight: 600;
    color: rgba(234, 244, 250, .62);
    background: rgba(255, 255, 255, .028);
  }
  .col-head .dot { width: 7px; height: 7px; border-radius: 50%; }
  .col-head .dot.think { background: #F59E0B; }
  .col-head .dot.out { background: #00B4D8; }
  pre.stream-text {
    flex: 1 1 auto; min-height: 0; margin: 0; overflow: auto;
    padding: 12px 16px 18px 16px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word;
    color: #C9E9F5;
    scrollbar-width: thin;
  }
  pre.stream-text.think { color: #E5C98B; }
  pre.stream-text:empty::after {
    content: "▌";
    animation: caret .9s step-end infinite;
    color: #00B4D8;
  }
  @keyframes caret { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
</style>
</head>
<body>
  <header>
    <div class="head-row">
      <div class="orb">AI</div>
      <div>
        <h1>{{title}}</h1>
        <p class="sub">{{message}}</p>
      </div>
      <div class="status genui-status" data-genui-status="1">正在初始化…</div>
    </div>
    <div class="bar"><i></i></div>
    <ul class="steps">{{steps}}</ul>
  </header>

  <main>
    <section class="stream">
      <div class="stream-head">
        <span class="live"><i></i>实时输出</span>
        <span class="stream-title">AI 工作日志</span>
        <span class="phase" data-genui-stream-phase="1">准备中</span>
        <span class="stat" data-genui-stream-stat="1">等待模型输出…</span>
      </div>
      <div class="stream-body">
        <div class="col">
          <div class="col-head"><i class="dot think"></i>思考过程</div>
          <pre class="stream-text think" data-genui-stream="think"></pre>
        </div>
        <div class="col">
          <div class="col-head"><i class="dot out"></i>生成内容</div>
          <pre class="stream-text" data-genui-stream="output"></pre>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
